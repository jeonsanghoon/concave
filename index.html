<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오목</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>오목</h1>
      <p class="subtitle">15×15 · 다섯 개 연속으로 승리</p>
    </header>

    <section class="auth-screen" id="auth-screen">
      <div class="auth-card">
        <h2 id="auth-title">로그인</h2>
        <div class="auth-tabs">
          <button class="auth-tab active" data-auth="login">로그인</button>
          <button class="auth-tab" data-auth="register">회원가입</button>
        </div>
        <div class="auth-form">
          <div class="name-field">
            <label for="auth-username">아이디</label>
            <input class="name-input" id="auth-username" type="text" maxlength="12" placeholder="2~12자" autocomplete="username">
          </div>
          <div class="name-field">
            <label for="auth-password">비밀번호</label>
            <input class="name-input" id="auth-password" type="password" maxlength="32" placeholder="4자 이상" autocomplete="current-password">
          </div>
          <p class="auth-error hidden" id="auth-error"></p>
          <button class="ctrl-btn auth-submit" id="auth-submit-btn">로그인</button>
          <button class="ctrl-btn secondary guest-btn" id="guest-btn">게스트로 시작</button>
        </div>
        <p class="auth-hint">온라인 대전은 로그인 후 이용 가능합니다.</p>
      </div>
    </section>

    <section class="menu hidden" id="menu">
      <div class="user-bar" id="user-bar">
        <span class="user-greeting" id="user-greeting"></span>
        <button class="ctrl-btn secondary small-btn" id="logout-btn">로그아웃</button>
      </div>
      <div class="name-setup">
        <div class="name-field">
          <label for="name-black">흑 닉네임</label>
          <input class="name-input" id="name-black" type="text" maxlength="12" placeholder="닉네임 입력" autocomplete="off">
        </div>
        <div class="name-field" id="name-white-field">
          <label for="name-white">백 닉네임</label>
          <input class="name-input" id="name-white" type="text" maxlength="12" placeholder="닉네임 입력" autocomplete="off">
        </div>
      </div>

      <h2>게임 모드 선택</h2>
      <div class="mode-buttons">
        <button class="mode-btn" data-mode="pvp">
          <span class="mode-icon">👥</span>
          <span class="mode-title">사람 vs 사람</span>
          <span class="mode-desc">같은 기기에서 번갈아 두기</span>
        </button>
        <button class="mode-btn" data-mode="pvc">
          <span class="mode-icon">🤖</span>
          <span class="mode-title">사람 vs 컴퓨터</span>
          <span class="mode-desc">AI와 대결 (흑: 플레이어)</span>
        </button>
        <button class="mode-btn" data-mode="online">
          <span class="mode-icon">🌐</span>
          <span class="mode-title">온라인 대전</span>
          <span class="mode-desc">방 코드로 친구와 원격 대전</span>
        </button>
      </div>
    </section>

    <section class="online-lobby hidden" id="online-lobby">
      <button class="back-link" id="lobby-back-btn">← 메뉴로</button>
      <h2>온라인 대전</h2>

      <div class="name-setup lobby-name hidden" id="online-name-setup">
        <div class="name-field">
          <label for="online-name">내 닉네임</label>
          <input class="name-input" id="online-name" type="text" maxlength="12" placeholder="닉네임 입력" autocomplete="off">
        </div>
      </div>

      <div class="lobby-tabs">
        <button class="lobby-tab active" data-tab="list">방 목록</button>
        <button class="lobby-tab" data-tab="create">방 만들기</button>
        <button class="lobby-tab" data-tab="join">코드 참가</button>
      </div>

      <div class="lobby-panel" id="panel-list">
        <div class="room-list-header">
          <p class="lobby-desc">대기 중인 방 목록입니다. 클릭하면 바로 참가합니다.</p>
          <button class="ctrl-btn secondary small-btn" id="refresh-room-list-btn">새로고침</button>
        </div>
        <p class="storage-warning hidden" id="storage-warning"></p>
        <ul class="room-list" id="room-list">
          <li class="room-list-empty">방 목록을 불러오는 중...</li>
        </ul>
      </div>

      <div class="lobby-panel hidden" id="panel-create">
        <p class="lobby-desc">방 이름을 정하고 생성하세요. 방장은 <strong>흑</strong>으로 먼저 둡니다.</p>
        <div class="name-field create-room-name">
          <label for="room-name-input">방 이름</label>
          <input class="name-input" id="room-name-input" type="text" maxlength="20" placeholder="예: 우리 가족 오목방" autocomplete="off">
        </div>
        <button class="ctrl-btn lobby-action" id="create-room-btn">새 방 만들기</button>
      </div>

      <div class="lobby-panel hidden" id="panel-join">
        <p class="lobby-desc">친구에게 받은 6자리 방 코드를 입력하세요.</p>
        <input class="room-input" id="room-code-input" type="text" maxlength="6" placeholder="예: ABC123" autocomplete="off">
        <button class="ctrl-btn lobby-action" id="join-room-btn">참가하기</button>
      </div>

      <div class="lobby-waiting hidden" id="lobby-waiting">
        <p class="waiting-label" id="waiting-room-name">방 이름</p>
        <p class="waiting-room-title" id="waiting-room-title"></p>
        <p class="waiting-label">방 코드</p>
        <div class="room-code-display">
          <span id="room-code-text">------</span>
          <button class="copy-btn" id="copy-code-btn" title="복사">📋</button>
        </div>
        <p class="waiting-status" id="waiting-status">상대를 기다리는 중...</p>
        <button class="ctrl-btn secondary" id="cancel-wait-btn">취소</button>
      </div>

      <p class="lobby-error hidden" id="lobby-error"></p>
    </section>

    <section class="game hidden" id="game">
      <div class="game-info">
        <div class="player-info black-player">
          <span class="stone-preview black"></span>
          <span class="player-name" id="black-name">흑</span>
        </div>
        <div class="status" id="status">흑의 차례</div>
        <div class="player-info white-player">
          <span class="stone-preview white"></span>
          <span class="player-name" id="white-name">백</span>
        </div>
      </div>

      <div class="board-wrapper">
        <canvas id="board" width="600" height="600"></canvas>
      </div>

      <div class="room-badge hidden" id="room-badge">
        <span id="room-badge-name"></span>
        <span class="room-badge-code">(<span id="room-badge-code"></span>)</span>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="undo-btn">한 수 무르기</button>
        <button class="ctrl-btn" id="restart-btn">다시 시작</button>
        <button class="ctrl-btn secondary" id="menu-btn">메뉴로</button>
      </div>
    </section>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h2 id="result-title">승리!</h2>
      <p id="result-message"></p>
      <div class="modal-buttons">
        <button class="ctrl-btn" id="play-again-btn">다시 하기</button>
        <button class="ctrl-btn secondary" id="back-menu-btn">메뉴로</button>
      </div>
    </div>
  </div>

  <script src="ai.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
